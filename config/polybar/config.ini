[colors]
bg = #1a1b26
fg = #c0caf5
accent = #7aa2f7
muted = #565f89
warn = #f7768e

[bar/sartoria]
width = 100%
height = 28
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=11;2
font-1 = JetBrains Mono:size=11;2
font-2 = DejaVu Sans Mono:size=11;2
modules-left = tags
modules-center = date
modules-right = battery network volume
padding = 1
module-margin = 1
override-redirect = false
wm-restack = generic

[module/tags]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M
label = %date%

[module/battery]
type = internal/battery
; Names are directories under /sys/class/power_supply (this pack is BAT1).
battery = BAT1
adapter = ACAD
full-at = 98
low-at = 15
poll-interval = 5

format-charging = <ramp-capacity> <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.accent}
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.warn}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

[module/network]
type = custom/script
exec = "$HOME/.config/polybar/network"
interval = 5
click-left = herbstclient spawn "$HOME/.config/polybar/nmtui"

[module/volume]
type = internal/pulseaudio
; Percent added or removed by one scroll tick. Stops at full volume.
interval = 5
use-ui-max = false

format-volume = <ramp-volume>
format-muted = <label-muted>
format-muted-foreground = ${colors.muted}

label-muted = 󰝟

ramp-volume-0 = 󰖁
ramp-volume-1 = 󰕿
ramp-volume-2 = 󰖀
ramp-volume-3 = 󰕾
