[colors]
bg = #1a1b26
fg = #c0caf5
accent = #7aa2f7
muted = #565f89

[bar/sartoria]
width = 100%
height = 28
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=11;2
modules-left = tags
modules-center = title
modules-right = date
tray-position = none
padding = 1
module-margin = 1

[module/tags]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.accent}
label-occupied = %name%
label-empty = %name%
label-empty-foreground = ${colors.muted}

[module/title]
type = internal/xwindow
label = %title:0:60:...%
label-empty =

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M
label = %date%
