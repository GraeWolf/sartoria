# Hybrid Prime. Debian DKMS files are nvidia-current*.ko; `options nvidia` is
# ignored. udev loads nvidia-current from PCI aliases. Do not put `nvidia` in
# modules-load.d (there is no nvidia.ko; boot prints FATAL module not found).
#
# This G15 is s2idle-only and the 3060 Mobile reports VRAM self-refresh.
# EnableS0ixPowerManagement lets the kernel PM callbacks park VRAM.
# PreserveVideoMemoryAllocations + writing /proc/driver/nvidia/suspend made
# lid-close spin the fans and never enter s2idle (GPU busy-loop). Do not set it.
options nvidia-current NVreg_EnableS0ixPowerManagement=1
options nvidia-current-drm modeset=1
options nvidia-drm modeset=1
blacklist nouveau
options nouveau modeset=0
