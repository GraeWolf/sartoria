# In-kernel module name is nvidia even though the file is nvidia-current.ko.
# S0ix only. Do not set PreserveVideoMemoryAllocations on the cmdline: that
# path plus /proc/driver/nvidia/suspend hung this G15 (fans, heat, no s2idle).
#
# i8042.dumbkbd: this G15's AT keyboard rejects ATKBD_CMD_RESET_DIS on
# resume ("Failed to deactivate keyboard on isa0060/serio0") and then
# stops reporting keys until a hard power-off. The controller is
# input-only so Linux does not send that command. Keyboard backlight
# stays on the USB ITE device. If the login keyboard is dead after
# reboot, remove this parameter from the GRUB entry.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }nvidia.NVreg_EnableS0ixPowerManagement=1 i8042.dumbkbd=1"
