# Hybrid laptop: the panel is on the iGPU (10-igpu.conf, PrimaryGPU yes).
# NVIDIA has no internal outputs. Keep it as a Prime offload source.
# Do not set PrimaryGPU on nvidia (that is reverse-PRIME / dGPU-drives-panel).
Section "OutputClass"
    Identifier "nvidia-hybrid-offload"
    MatchDriver "nvidia-drm"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "PrimaryGPU" "no"
    ModulePath "/usr/lib/x86_64-linux-gnu/nvidia/xorg,/usr/lib/nvidia/nvidia"
EndSection

Section "ServerFlags"
    Option "AllowNVIDIAGPUScreens" "true"
EndSection
