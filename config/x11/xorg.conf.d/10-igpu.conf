# XLibre ABI 28. Leftover Debian Xorg DDXes (nouveau/ati/vesa) are ABI 25
# and must not be chosen as the primary driver.
# Hybrid laptops: the internal panel is on the iGPU (AMD or Intel).
Section "OutputClass"
    Identifier "amdgpu-modesetting"
    MatchDriver "amdgpu"
    Driver "modesetting"
    Option "PrimaryGPU" "yes"
EndSection

Section "OutputClass"
    Identifier "i915-modesetting"
    MatchDriver "i915"
    Driver "modesetting"
    Option "PrimaryGPU" "yes"
EndSection
